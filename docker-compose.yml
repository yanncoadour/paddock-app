services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paddock
      POSTGRES_USER: paddock
      POSTGRES_PASSWORD: paddock
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: >
      sh -c "pip install -r requirements.txt &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://paddock:paddock@db:5432/paddock
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db_data:
